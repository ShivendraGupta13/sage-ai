server:
  port: 8080

sage:
  graph-rag:
    base-url: ${SAGE_GRAPH_RAG_BASE_URL:http://localhost:8000}
  adk:
    llm:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model-name: ${SAGE_LLM_MODEL:llama3.2}
      temperature: ${SAGE_LLM_TEMPERATURE:0.0}
  retrieval:
    top-k: ${SAGE_RETRIEVAL_TOP_K:5}
    min-score: ${SAGE_RETRIEVAL_MIN_SCORE:0.60}
  scoring:
    w1: ${SAGE_SCORING_W1:0.6}
    w2: ${SAGE_SCORING_W2:0.4}
    dual-match-boost: ${SAGE_SCORING_DUAL_BOOST:0.1}
    min-score: ${SAGE_SCORING_MIN_SCORE:0.40}
