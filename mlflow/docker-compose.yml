# MLflow Tracking Stack — PostgreSQL backend + RustFS artifact store
#
# Usage:
#   cp .env.example .env      # review/adjust values
#   docker compose up -d      # starts 3 containers
#   docker compose down       # stops (data preserved in volumes)
#   docker compose down -v    # ⚠ destroys all volumes and data
#
# MLflow UI → http://localhost:5000

services:

  # ── 1. PostgreSQL — MLflow backend store ────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB:       ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. RustFS — S3-compatible artifact store ────────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: mlflow-rustfs
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_ROOT_USER:     ${RUSTFS_ROOT_USER:-minioadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-minioadmin}
    volumes:
      - rustfs_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # ── 2b. Auto-create S3 Bucket in RustFS ─────────────────────────────────────
  create-bucket:
    image: minio/mc:latest
    container_name: mlflow-create-bucket
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myrustfs http://rustfs:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myrustfs/mlflow-artifacts;
      exit 0;
      "

  # ── 3. MLflow Tracking Server ────────────────────────────────────────────────
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile   # extends ghcr.io/mlflow/mlflow:v3.14.0 + psycopg2-binary + boto3
    container_name: mlflow-server
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACT_ROOT:    s3://${MLFLOW_BUCKET:-mlflow-artifacts}
      AWS_ACCESS_KEY_ID:       ${RUSTFS_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY:   ${RUSTFS_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL:  http://rustfs:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --allowed-hosts "*"
        --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
        --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow-artifacts}
        --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # ── 3b. Auto-create Experiment in MLflow ────────────────────────────────────
  create-experiment:
    image: curlimages/curl:latest
    container_name: mlflow-create-experiment
    depends_on:
      mlflow:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      curl -s -X POST http://mlflow:5000/api/2.0/mlflow/experiments/create -H 'Content-Type: application/json' -d '{\"name\": \"sage-ai-agent-evaluation\"}' || true;
      exit 0;
      "

  # ── 4. OpenTelemetry Collector ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: mlflow-otel-collector
    ports:
      - "4317:4317"  # OTLP gRPC receiver
      - "4318:4318"  # OTLP HTTP receiver
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      mlflow:
        condition: service_healthy
      create-experiment:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  rustfs_data:

