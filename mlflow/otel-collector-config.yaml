receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp_http/mlflow:
    traces_endpoint: "http://mlflow:5000/v1/traces"
    headers:
      "Host": "localhost:5000"
      "x-mlflow-experiment-id": "1"
    encoding: json
    compression: none
    tls:
      insecure: true
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/mlflow, debug]
